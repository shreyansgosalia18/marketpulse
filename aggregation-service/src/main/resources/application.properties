spring.application.name=aggregation-service

# 127.0.0.1, not "localhost" - on this stack "localhost" resolves to the
# IPv6 loopback first, which Docker's port mapping and Kafka's advertised
# listener don't accept. See docs/reference/event-stream.md.
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.consumer.group-id=aggregation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Matches env/dev.env's local-dev-only defaults - see docs/reference/local-dev.md.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/marketpulse
spring.datasource.username=marketpulse
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver
